<body>


<div class="app" id="app">
  <aside class="side" id="side" aria-label="Projects">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor"/><path d="M8 12.5l2.6 2.5L16 9" stroke="var(--ground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Clipped</b></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main id="mainEl"></main>
</div>
<div id="drawerRoot"></div>
<dialog id="dlg"><div class="dlg-h"><b class="mono" id="dlgTitle"></b><span class="toolbar"><button class="btn sm" id="dlgCopy">Copy</button><button class="btn sm ghost" id="dlgClose">Close</button></span></div><pre id="dlgPre"></pre></dialog>

<script>
const STATUSES=[
  {id:'idea',label:'Idea'},{id:'active',label:'In progress'},{id:'parked',label:'Parked'},
  {id:'review',label:'Your turn'},{id:'done',label:'Done'}];
const SL=Object.fromEntries(STATUSES.map(s=>[s.id,s.label]));
/* A question runs the same five statuses, but nobody says "in progress" about
   a question — so the Questions tab renames them and nothing else changes. */
const QSL={idea:'Open',active:'Looking into',parked:'Parked',review:'Answered',done:'Decided'};
const sl=id=>(P.tab==='questions'?QSL:SL)[id];
/* The note means something different per status — and again for a question. */
const noteLabel=f=>f.type==='question'
  ? (f.status==='review'||f.status==='done'?'Answer':f.status==='parked'?'Where you stopped':'What you\u2019re checking')
  : (f.status==='parked'?'Where you stopped':f.status==='active'?'Next step':f.status==='review'?'What to check':'Next');
const colLabel=c=>P.tab!=='questions'?c.label
  :c.id==='note'?'Answer / what you\u2019re checking':c.id==='title'?'Question':c.label;

/* The five tabs. Features and questions are cards; the rest are notes. */
const TABS=[
  {id:'features',label:'Work',note:null},   /* the data is still features; the label isn't */
  {id:'questions',label:'Questions',note:null},
  {id:'brainstorms',label:'Brainstorms',note:'brainstorm'},
  {id:'plans',label:'Plans',note:'plan'},
  {id:'references',label:'References',note:'reference'}];
const TAB=()=>TABS.find(t=>t.id===P.tab)||TABS[0];
const isNoteTab=()=>!!TAB().note;
/* What the second column holds, per kind: the thing you'd actually click. */
const NOTE_EMPTY={
  brainstorm:'No brainstorms yet. Claude adds one when a conversation lands on something worth keeping.',
  plan:'No plans yet. Point one at a spec or plan document and the cards it produced stay tied to it.',
  reference:'No references yet. Anything you looked up and would look up again belongs here.'};
const NOTE_HINT={
  brainstorm:'A brainstorm is the thinking, not the work — what it decided lives on the cards it links to.',
  plan:'Plans hold the reasoning; the board holds the state. Editing a card never edits the document.',
  reference:'Links you would otherwise have to scroll back through the chat to find.'};
const KINDL={brainstorm:'Brainstorm',plan:'Plan',reference:'Reference'};
/* What the new-note row asks for first, in the words you'd use. */
const NOTE_TITLE_PH={brainstorm:'What was the conversation about? Then Enter',plan:'Name the plan, then Enter',reference:'What is it? Then Enter'};
/* The drawer asks a different thing of each kind than the table column does. */
const NOTEBODY={
  brainstorm:{label:'What was decided',ph:'The decision the conversation reached \u2014 not everything that was said'},
  plan:{label:'Notes',ph:'Anything worth knowing that isn\u2019t in the document'},
  reference:{label:'Why it\u2019s here',ph:'What this answered, in one line'}};
const NOTEFIELD={brainstorm:{k:'body',label:'What came of it',ph:'What was decided (optional)'},
  plan:{k:'file',label:'Document',ph:'docs/plan.md (optional)'},
  reference:{k:'url',label:'Link',ph:'https://… (optional)'}};
const GORDER={parked:0,active:1,review:2,idea:3,done:4};
const KEY='clipped.v2';
const NOW=Date.now(), M=60000, H=60*M, D=24*H;
const PCOLORS=['#2F5BFF','#0B93B5','#E0561F','#7B5CE0','#1E9E68','#C2367A','#4B6A8F'];
const ICON={
  table:'<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 6.5h12M2 10h12M6 3v10"/></svg>',
  board:'<svg viewBox="0 0 16 16"><rect x="2" y="3" width="3.2" height="10" rx="1"/><rect x="6.4" y="3" width="3.2" height="7" rx="1"/><rect x="10.8" y="3" width="3.2" height="5" rx="1"/></svg>',
  timeline:'<svg viewBox="0 0 16 16"><path d="M2 4h6M5 8h8M3 12h5"/></svg>'};
const COLS=[
  {id:'key',label:'Key',w:92,sort:'key',lock:true},
  {id:'project',label:'Project',w:124,sort:'project',home:true},
  {id:'title',label:'Card',w:380,sort:'title',lock:true},
  {id:'area',label:'Area',w:150,sort:'area'},
  {id:'status',label:'Status',w:136,sort:'status'},
  {id:'note',label:'Next step / where stopped',w:300,flex:true},
  {id:'progress',label:'Progress',w:120,sort:'progress'},
  {id:'steps',label:'Steps',w:70},
  {id:'files',label:'Files',w:64},
  {id:'updated',label:'Updated',w:92,sort:'updated'},
  {id:'by',label:'Last by',w:104}];

/* ---------- data: the local server ---------- */
/* Served by `board ui`. The hosted UI reaches the same API on localhost:4747. */
/* Served by `board ui` → talk to this origin. Hosted on the site → talk to the local server. */
const LOCAL=/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/;
const API=LOCAL.test(location.origin)?location.origin:'http://localhost:4747';

async function api(path,opts){
  const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});
  const t=await r.text(); const b=t?JSON.parse(t):null;
  if(!r.ok) throw new Error((b&&b.error)||r.status+' '+r.statusText);
  return b;
}

/* board.json card -> the shape the views already speak */
const toFeature=(pid,c)=>({id:pid+':'+c.key,key:c.key,num:+c.key.slice(c.key.lastIndexOf('-')+1),project:pid,
  title:c.title,type:c.type,status:c.status,note:c.note,doneWhen:c.doneWhen||[],
  steps:(c.steps||[]).map(x=>({...x})),files:(c.files||[]).slice(),links:(c.links||[]).slice(),area:c.area||'',inArea:c.inArea||'',
  createdAt:Date.parse(c.createdAt),updatedAt:Date.parse(c.updatedAt),by:c.updatedBy==='claude'?'claude':'you',
  log:(c.log||[]).map(l=>({at:Date.parse(l.at),by:l.by==='claude'?'claude':'you',text:l.text}))});

const toNote=(pid,n)=>({id:pid+':'+n.id,nid:n.id,project:pid,kind:n.kind,title:n.title,
  body:n.body||'',considered:n.considered||'',url:n.url||'',file:n.file||'',cards:(n.cards||[]).slice(),
  createdAt:Date.parse(n.createdAt),updatedAt:Date.parse(n.updatedAt),by:n.updatedBy==='claude'?'claude':'you'});

async function loadAll(){
  const ps=await api('/api/projects');
  S.projects=ps.map((p,i)=>({id:p.id,key:p.key,name:p.name,path:p.path,repoUrl:p.repoUrl||'',color:PCOLORS[i%PCOLORS.length],error:p.error}));
  const boards=await Promise.all(ps.map(p=>p.error?Promise.resolve(null):api('/api/projects/'+p.id+'/board').catch(()=>null)));
  S.features=[]; S.notes=[];
  boards.forEach((b,i)=>{ if(!b) return;
    S.areas[ps[i].id]=b.areas||[];
    for(const c of b.features) S.features.push(toFeature(ps[i].id,c));
    for(const n of b.notes||[]) S.notes.push(toNote(ps[i].id,n)) });
  S.unlinked=await api('/api/discover').catch(()=>[]);
  await loadStats();
  if(view!=='home'&&!proj(view)) view='home';
}
/* Claude Code sessions per project, counted by the local server from Claude Code's own logs. */
async function loadStats(){
  const rows=await api('/api/stats').catch(()=>null);
  if(rows) S.stats=Object.fromEntries(rows.map(r=>[r.id,r]));
}
function hrs(ms){ if(ms<H) return Math.round(ms/M)+' min'; const h=ms/H; return (h<100?h.toFixed(1):Math.round(h).toLocaleString())+' h' }
function sessionLine(p){
  const rows=p?[S.stats[p.id]].filter(Boolean):S.projects.map(x=>S.stats[x.id]).filter(Boolean);
  const n=rows.reduce((a,r)=>a+r.sessions,0);
  if(!n) return '';
  const active=rows.reduce((a,r)=>a+r.activeMs,0), open=rows.reduce((a,r)=>a+r.openMs,0);
  const last=Math.max(...rows.map(r=>r.lastAt?Date.parse(r.lastAt):0));
  return `<div class="kpis" aria-label="Claude Code sessions">
    <span title="Claude Code sessions started in ${p?'this folder or below it':'any of these projects'}"><b>${n.toLocaleString()}</b> session${n===1?'':'s'}</span>
    <span title="Time Claude or you were doing something. A gap over 5 minutes counts as 5."><b>${hrs(active)}</b> active</span>
    <span title="First message to last, per session — includes time a session sat open idle"><b>${hrs(open)}</b> open</span>
    ${last?`<span title="${esc(new Date(last).toLocaleString())}">last <b>${Date.now()-last<M?'just now':ago(last)+' ago'}</b></span>`:''}
  </div>`;
}

/* Claude Code knows these folders; they just don't have a board yet. */
async function createBoard(path,name){
  try{
    await api('/api/projects',{method:'POST',body:JSON.stringify({path,name})});
    await loadAll(); render(); toast(name+' has a board now');
  }catch(e){ toast(e.message) }
}

async function loadProject(id){
  const b=await api('/api/projects/'+id+'/board').catch(()=>null);
  if(!b) return loadAll();
  S.features=S.features.filter(f=>f.project!==id).concat(b.features.map(c=>toFeature(id,c)));
  S.notes=S.notes.filter(n=>n.project!==id).concat((b.notes||[]).map(n=>toNote(id,n)));
  S.areas[id]=b.areas||[];
  const p=proj(id); if(p){p.name=b.project.name;p.key=b.project.key}
}

/* Every write goes to the CLI through the API; the response is the new truth. */
function replaceCard(pid,card){
  const f=toFeature(pid,card), i=S.features.findIndex(x=>x.id===f.id);
  if(i>=0) S.features[i]=f; else S.features.push(f);
  return f;
}
async function saveCard(f,body){
  try{
    const card=await api('/api/projects/'+f.project+'/features/'+f.key,{method:'PATCH',body:JSON.stringify(body)});
    replaceCard(f.project,card); render(); return true;
  }catch(e){ toast(e.message); await loadProject(f.project); render(); return false }
}
async function deleteCard(f){
  try{ await api('/api/projects/'+f.project+'/features/'+f.key,{method:'DELETE'});
       S.features=S.features.filter(x=>x.id!==f.id); return true }
  catch(e){ toast(e.message); return false }
}

/* The project's own name. `board rename` under the hood, like every other write. */
async function renameProject(p,name){
  try{
    await api('/api/projects/'+p.id,{method:'PATCH',body:JSON.stringify({name})});
    p.name=name; render(); toast('Renamed to '+name);
  }catch(e){ toast(e.message); await loadAll(); render() }
}

/* Notes go through the same CLI-backed API as cards. */
function replaceNote(pid,raw){
  const n=toNote(pid,raw), i=S.notes.findIndex(x=>x.id===n.id);
  if(i>=0) S.notes[i]=n; else S.notes.push(n);
  return n;
}
async function addNote(pid,body){
  try{ return replaceNote(pid,await api('/api/projects/'+pid+'/notes',{method:'POST',body:JSON.stringify(body)})) }
  catch(e){ toast(e.message); return null }
}
async function saveNote(n,body){
  try{ replaceNote(n.project,await api('/api/projects/'+n.project+'/notes/'+n.nid,{method:'PATCH',body:JSON.stringify(body)}));
       render(); return true }
  catch(e){ toast(e.message); await loadProject(n.project); render(); return false }
}
async function deleteNote(n){
  try{ await api('/api/projects/'+n.project+'/notes/'+n.nid,{method:'DELETE'});
       S.notes=S.notes.filter(x=>x.id!==n.id); render(); return true }
  catch(e){ toast(e.message); return false }
}

let S={projects:[],features:[],notes:[],unlinked:[],stats:{},areas:{}};
let live=false, dirty=false, pendingPark=null;
let P={tab:'features',mode:'table',group:'status',density:'comfy',hidden:['files'],hideDone:false,collapsed:['idea'],areaPick:[],sideShut:false};
try{Object.assign(P,JSON.parse(localStorage.getItem(KEY+'.prefs'))||{})}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(KEY+'.prefs',JSON.stringify(P))}catch(e){}};
let sel=new Set();   /* cards ticked for a bulk action */
let view='home', query='', openId=null, sort={k:'updated',dir:1}, filter='all', addingProject=false, editCell=null;
/* A note opens its own drawer: same shell, different questions answered. */
let openNote=null;
let comp={project:null,status:'idea'};
const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(t){const d=Date.now()-t; if(d<H) return Math.max(1,Math.round(d/M))+'m'; if(d<D) return Math.round(d/H)+'h'; return Math.round(d/D)+'d'}
const color=s=>`var(--s-${s})`;
const who=by=>`<span class="who ${by}"><b>${by==='claude'?'C':'Y'}</b><span>${by==='claude'?'Claude':'You'}</span></span>`;
const pf=id=>S.features.filter(f=>f.project===id&&f.type!=='question');
const pn=id=>S.notes.filter(n=>n.project===id);
const proj=id=>S.projects.find(p=>p.id===id);
const fkey=f=>f.key;
const pbadge=(p,sm)=>`<span class="pkey ${sm?'sm':''}" style="background:${p.color}">${esc(p.key.slice(0,2))}</span>`;
/* A card's bar is its checklist and nothing else. With no steps there is nothing
   to measure, so there is no bar — a guessed 80% looked like a fact. */
function progress(f){
  if(f.status==='done') return 100;
  if(f.steps.length) return Math.round(100*f.steps.filter(s=>s.done).length/f.steps.length);
  return null;
}
/* Ideas are not work yet: counting them at 0% would make a good brainstorm
   look like the project went backwards. */
const committed=fs=>fs.filter(f=>f.status!=='idea');
/* Done out of everything that isn't an idea. Waiting on you is not done. */
const doneShare=fs=>{const c=committed(fs);return c.length?Math.round(100*c.filter(f=>f.status==='done').length/c.length):0};
const progBar=f=>{const pg=progress(f);if(pg===null) return `<div class="prog none"><span class="pct" title="No steps to count">—</span></div>`;
  return `<div class="prog"><div class="track"><div class="fill" style="width:${pg}%;background:${color(f.status)}"></div></div><span class="pct">${pg}%</span></div>`};
/* Home folders read as ~ — the path is for recognising, not typing. */
const tilde=p=>String(p||'').replace(/^\/(Users|home)\/[^/]+/,'~');

/* ---------- new since you last looked ---------- */
/* Remembered in this browser only: when you started looking, and when you last
   opened each card. A card Claude changed after that gets a dot until you open it. */
const prefsSeenKey=KEY+'.prefs.seen';
let SEEN={since:Date.now(),cards:{}};
try{const v=JSON.parse(localStorage.getItem(prefsSeenKey));if(v&&typeof v.since==='number'&&v.cards)SEEN=v;else localStorage.setItem(prefsSeenKey,JSON.stringify(SEEN))}catch(e){}
const saveSeen=()=>{try{localStorage.setItem(prefsSeenKey,JSON.stringify(SEEN))}catch(e){}};
const isNew=f=>f.by==='claude'&&f.updatedAt>Math.max(SEEN.since,SEEN.cards[f.id]||0);
function markSeen(f){ if(!isNew(f)) return; SEEN.cards[f.id]=Date.now(); saveSeen() }
function markAllSeen(){ SEEN={since:Date.now(),cards:{}}; saveSeen() }
const newDot=f=>isNew(f)?`<span class="newdot" title="Changed by Claude since you last opened it"></span>`:'';
/* Parked and waiting both mean "nothing has happened here", and after a few
   days that is the most useful thing the row can tell you. */
const stale=f=>(f.status==='parked'||f.status==='review')&&Date.now()-f.updatedAt>3*D;
const sinceLabel=f=>f.status==='parked'?`idle ${ago(f.updatedAt)}`:f.status==='review'?`waiting ${ago(f.updatedAt)}`:`updated ${ago(f.updatedAt)} ago`;
/* A toast can carry an Undo. It stays longer then, long enough to reach for it. */
function toast(t,undo){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');
  const span=document.createElement('span');span.textContent=t;el.appendChild(span);
  if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{el.remove();undo()};el.appendChild(b)}
  document.body.appendChild(el);setTimeout(()=>el.remove(),undo?6000:1900);
}

/* ---------- left menu ---------- */
function renderNav(){
  let h=`<div class="nav-label"><span>Overview</span></div>
  <button class="nav-item" data-go="home" aria-current="${view==='home'}" title="All projects">
    <span class="pkey all">∗</span><span class="name">All projects</span><span></span></button>
  <div class="nav-label" style="margin-top:14px"><span>Projects · ${S.projects.length}</span><button id="addProjBtn" title="Add project" aria-label="Add project">+</button></div>`;
  if(false) h+=`<form class="newproj" id="newProjForm"><input id="npName" placeholder="Project name" aria-label="Project name" required><input id="npPath" class="mono" placeholder="~/code/my-app" aria-label="Project folder"><div class="r"><button type="button" class="btn sm ghost" id="npCancel">Cancel</button><button class="btn sm primary">Add</button></div></form>`;
  for(const p of S.projects){
    const pr=doneShare(pf(p.id));
    h+=`<button class="nav-item" data-go="${p.id}" aria-current="${view===p.id}" title="${esc(p.name)}">
      ${pbadge(p)}<span class="name">${esc(p.name)}</span><span></span>
      <span class="mini" aria-hidden="true"><span style="width:${pr}%"></span></span></button>`;
  }
  if(S.unlinked.length){
    h+=`<div class="nav-label" style="margin-top:14px"><span>No board yet · ${S.unlinked.length}</span></div>`;
    for(const u of S.unlinked.slice(0,8))
      h+=`<button class="nav-item unlinked" data-init="${esc(u.path)}" title="${esc(u.path)}">
        <span class="pkey none">+</span><span class="name">${esc(u.name)}</span><span class="add">Add board</span></button>`;
    if(S.unlinked.length>8) h+=`<div class="nav-label"><span class="hint">+${S.unlinked.length-8} more</span></div>`;
  }
  $('nav').innerHTML=h;
  document.querySelectorAll('[data-init]').forEach(b=>b.onclick=()=>{
    const u=S.unlinked.find(x=>x.path===b.dataset.init); if(u) createBoard(u.path,u.name)});
  $('addProjBtn').onclick=()=>openDialog('Add a project',
    'A project joins the board when it has one. In that project\'s folder, run:\n\n  board init\n\nOr open it in Claude Code and ask for a board — the plugin offers one on the first session.\nIt shows up here the moment the file exists.');
}

/* ---------- page ---------- */
/* Cards in the current tab: Questions holds the question cards, Features the rest. */
function tabCards(){
  const p=proj(view), base=p?S.features.filter(f=>f.project===p.id):S.features;
  return base.filter(f=>P.tab==='questions'?f.type==='question':f.type!=='question');
}
/* Areas the Area chip can offer here, with how many cards each holds ("" = no area yet). */
function areaOptions(){
  const m=new Map();
  for(const f of tabCards()) m.set(f.inArea||'',(m.get(f.inArea||'')||0)+1);
  const names=[...m.keys()].filter(Boolean).sort((a,b)=>a.localeCompare(b));
  return [...names,...(m.has('')?['']:[])].map(n=>({name:n,count:m.get(n)}));
}
/* The ticked areas that exist in this view. None ticked (or none here) = every area. */
const areaPicked=()=>{const here=new Set(areaOptions().map(o=>o.name));return (P.areaPick||[]).filter(n=>here.has(n))};
function scopeFeatures(){
  const q=query.toLowerCase(), picked=areaPicked();
  return tabCards().filter(f=>(!picked.length||picked.includes(f.inArea||''))&&
    (filter==='all'||f.status===filter||(filter==='new'&&isNew(f)))&&(!P.hideDone||f.status!=='done'||filter==='done')&&
    (!q||f.title.toLowerCase().includes(q)||(f.note||'').toLowerCase().includes(q)||fkey(f).toLowerCase().includes(q)));
}
function scopeNotes(){
  const p=proj(view), q=query.toLowerCase(), kind=TAB().note;
  return (p?pn(p.id):S.notes).filter(n=>n.kind===kind&&
    (!q||n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q)||
       n.url.toLowerCase().includes(q)||n.file.toLowerCase().includes(q)||n.nid.toLowerCase().includes(q)));
}
/* Counts for the tab strip, in the current project or across all of them. */
function tabCount(t){
  const p=proj(view);
  if(t.note) return (p?pn(p.id):S.notes).filter(n=>n.kind===t.note).length;
  const base=p?S.features.filter(f=>f.project===p.id):S.features;
  return base.filter(f=>t.id==='questions'?f.type==='question':f.type!=='question').length;
}
function tabStrip(){
  return `<div class="tabs tabs-top" role="group" aria-label="Section">${TABS.map(t=>
    `<button data-tab="${t.id}" aria-pressed="${P.tab===t.id}">${t.label}<span class="c">${tabCount(t)}</span></button>`).join('')}</div>`;
}
/* One line under the title that means something on every tab. */
function homeSub(parked){
  const across=`across ${S.projects.length} project${S.projects.length===1?'':'s'}`;
  if(isNoteTab()) return `${tabCount(TAB())} ${TAB().note}${tabCount(TAB())===1?'':'s'} ${across}.`;
  if(P.tab==='questions'){
    const open=tabCards().filter(f=>f.status!=='done').length;
    return `${open} unsettled question${open===1?'':'s'} ${across}. Answered ones are waiting on a decision.`;
  }
  return `${parked} card${parked===1?'':'s'} parked ${across}. Parked work is listed first.`;
}
function renderPage(){
  const p=proj(view), isHome=!p, all=tabCards();
  const c=s=>all.filter(f=>f.status===s).length;
  const parked=S.features.filter(f=>(!p||f.project===p.id)&&f.type!=='question'&&f.status==='parked').length;
  const noun=P.tab==='questions'?'question':'card';
  let h=`<div class="head"><div>
      ${p?`<div class="crumb">${pbadge(p)}<span class="mono" title="${esc(p.path)}">${esc(tilde(p.path))}</span></div><h1><input class="h1in" id="projName" value="${esc(p.name)}" aria-label="Project name" spellcheck="false" title="Rename this project"></h1>${sessionLine(p)}`
         :`<h1>All ${esc(TAB().label.toLowerCase())}</h1><div class="sub">${esc(homeSub(parked))}</div>${sessionLine(null)}`}
    </div>
    <div class="toolbar"><input class="search" id="search" type="search" placeholder="Search ${esc(TAB().label.toLowerCase())}" value="${esc(query)}" aria-label="Search ${esc(TAB().label.toLowerCase())}" title="Press / to search">
      ${p?`<button class="btn" id="showJson">board.json</button>`:''}
      <button class="btn primary" id="newBtn">+ New ${isNoteTab()?esc(TAB().note):noun}</button></div></div>
  <div class="tabrow">${tabStrip()}${isNoteTab()?'':`
    <div class="tabs" role="group" aria-label="View">${(P.tab==='questions'?['table','board']:['table','board','timeline']).map(m=>`<button data-mode="${m}" aria-pressed="${P.mode===m}">${ICON[m]}${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>`}</div>
  ${isNoteTab()?renderNotesPage(isHome):''}`;
  if(isNoteTab()) return h;
  h+=`
  <div class="stats">
    <div class="bigbar"><div class="statrow"><div class="stat" title="Done, out of everything that isn\u2019t an idea"><b>${doneShare(all)}%</b> ${P.tab==='questions'?'decided':'done'}</div>${c('review')?`<button class="stat waiting" data-filter="review" title="Show only these"><b>${c('review')}</b> waiting on you</button>`:''}${(()=>{const n=all.filter(isNew).length;return n?`<span class="newbits"><button class="stat fresh" data-filter="new" title="Show only these"><span class="newdot"></span><b>${n}</b> new since you looked</button><button class="linkbtn" id="seenAll">Mark all seen</button></span>`:''})()}</div><div class="track">${STATUSES.map(s=>c(s.id)?`<span style="flex:${c(s.id)};background:${color(s.id)}" title="${sl(s.id)}: ${c(s.id)}"></span>`:'').join('')}</div></div>
    ${STATUSES.map(s=>`<div class="stat"><span class="dot" style="background:${color(s.id)}"></span><b>${c(s.id)}</b>${sl(s.id).toLowerCase()}</div>`).join('')}
  </div>
  <div class="chips" role="group" aria-label="Filter by status">
    <button data-filter="all" aria-pressed="${filter==='all'}">All <span class="c">${all.length}</span></button>
    ${['parked','active','review','idea','done'].map(s=>`<button data-filter="${s}" aria-pressed="${filter===s}"><span class="dot" style="background:${color(s)}"></span>${sl(s)} <span class="c">${c(s)}</span></button>`).join('')}
  </div>
  <div class="viewbar">
    <div class="opts">
      ${(()=>{const opts=areaOptions(); if(!opts.some(o=>o.name)) return ''; const picked=areaPicked();
        return `<details class="cols areas"><summary class="opt" style="padding-right:9px">Area <b>${!picked.length?'All':picked.length===1?esc(picked[0]||'No area'):picked.length+' areas'}</b></summary><div class="menu">
          ${opts.map(o=>`<label><input type="checkbox" data-area="${esc(o.name)}" ${picked.includes(o.name)?'checked':''}><span class="an">${o.name?esc(o.name):'No area yet'}</span><span class="ac">${o.count}</span></label>`).join('')}
          ${picked.length?`<button class="linkbtn colreset" id="areaClear" type="button">Show all areas</button>`:''}</div></details>`})()}
      ${P.mode!=='board'?`<span class="opt">Group by<select id="groupSel" aria-label="Group by">
        <option value="status" ${P.group==='status'?'selected':''}>Status</option>
        <option value="area" ${P.group==='area'?'selected':''}>Area</option>
        ${isHome?`<option value="project" ${P.group==='project'?'selected':''}>Project</option>`:''}
        <option value="none" ${P.group==='none'?'selected':''}>Nothing</option></select></span>`:''}
      ${P.mode==='table'?`<span class="opt">Density<select id="densSel" aria-label="Row density">
        <option value="comfy" ${P.density==='comfy'?'selected':''}>Comfortable</option>
        <option value="compact" ${P.density==='compact'?'selected':''}>Compact</option></select></span>
      <details class="cols"><summary class="opt" style="padding-right:9px">Columns · ${visibleCols(isHome).length}</summary><div class="menu">
        ${COLS.filter(c=>!c.home||isHome).map(c=>`<label><input type="checkbox" data-col="${c.id}" ${!P.hidden.includes(c.id)?'checked':''} ${c.lock?'disabled':''}>${colLabel(c)}</label>`).join('')}
        ${P.colW&&Object.keys(P.colW).length?`<button class="linkbtn colreset" id="colReset" type="button">Reset widths</button>`:''}
      </div></details>`:''}
      <label class="opt"><input type="checkbox" id="hideDone" ${P.hideDone?'checked':''}>Hide done</label>
    </div>
  </div>`;
  const fs=scopeFeatures();
  if(P.tab==='questions'&&P.mode==='timeline') P.mode='table';   /* a question has no duration worth drawing */
  h+= P.mode==='table'?renderTable(fs,isHome): P.mode==='board'?renderBoard(fs,isHome): renderTimeline(fs,isHome);
  return h;
}
/* Column widths the user dragged, per table kind; the default otherwise. */
const cw=(map,c)=>(P[map]&&P[map][c.id])||c.w;
const grip=(map,c)=>`<span class="colgrip" data-grip="${c.id}" data-map="${map}" title="Drag to resize · double-click to reset" aria-hidden="true"></span>`;
const visibleCols=isHome=>COLS.filter(c=>(!c.home||isHome)&&!P.hidden.includes(c.id)&&!(c.id==='area'&&P.group==='area'));

function groupsOf(fs,isHome){
  const g=P.group==='project'&&!isHome?'status':P.group;
  if(g==='none') return [{id:null,items:fs}];
  if(g==='project') return S.projects.map(p=>({id:p.id,head:`${pbadge(p,true)} ${esc(p.name)}`,items:fs.filter(f=>f.project===p.id)})).filter(x=>x.items.length);
  if(g==='area') return areaGroups(fs,isHome);
  return ['parked','active','review','idea','done'].map(s=>({id:s,head:`<span class="dot" style="background:${color(s)}"></span> ${sl(s)}`,items:fs.filter(f=>f.status===s)})).filter(x=>x.items.length);
}
/* Areas in the order the board names them, then ones only guessed from folders,
   then cards with no files yet. A group per project on All projects. */
function areaGroups(fs,isHome){
  const out=[];
  for(const p of S.projects){
    const mine=fs.filter(f=>f.project===p.id); if(!mine.length) continue;
    const named=(S.areas[p.id]||[]).map(a=>a.name);
    const guessed=[...new Set(mine.map(f=>f.inArea).filter(n=>n&&!named.includes(n)))].sort();
    for(const name of [...named,...guessed,'']){
      const items=mine.filter(f=>(f.inArea||'')===name); if(!items.length) continue;
      const work=items.filter(f=>f.status!=='idea'), done=work.filter(f=>f.status==='done').length;
      const tip=name?(named.includes(name)?esc((S.areas[p.id].find(a=>a.name===name).paths||[]).join(', ')||'Named by hand'):'From folder names — not named yet'):'Cards with no files yet';
      out.push({id:'a:'+p.id+':'+name,items,
        head:`${isHome?pbadge(p,true)+' ':''}<span class="area-name" title="${tip}">${name?esc(name):'No area yet'}</span>${name&&!named.includes(name)?' <span class="area-guess">from folders</span>':''}${work.length?` <span class="grp-sub">${done}/${work.length} done</span>`:''}`});
    }
  }
  return out;
}
function sortFs(fs){
  const val={key:f=>fkey(f),project:f=>proj(f.project).name,title:f=>f.title.toLowerCase(),area:f=>(f.inArea||'\uffff').toLowerCase(),status:f=>GORDER[f.status],progress:f=>progress(f)??-1,updated:f=>-f.updatedAt};
  const v=val[sort.k]||val.updated;
  return [...fs].sort((a,b)=>{const x=v(a),y=v(b);return (x>y?1:x<y?-1:(b.updatedAt-a.updatedAt))*sort.dir});
}

/* ---------- notes: brainstorms, plans, references ---------- */
/* Notes have no status and no progress, so they get a plainer table: what it
   is, where it points, and which cards came out of it. */
function noteCols(isHome){
  const f=NOTEFIELD[TAB().note];
  return [{id:'id',label:'Id',w:92},...(isHome?[{id:'project',label:'Project',w:124}]:[]),
    {id:'title',label:'Title',w:280},{id:'target',label:f.label,w:300},
    {id:'cards',label:'Cards',w:132},{id:'updated',label:'Updated',w:92},{id:'by',label:'Last by',w:104},{id:'del',label:'',w:44}];
}
const cardLink=(pid,key)=>`<button class="clink" data-card="${pid+':'+key}">${esc(key)}</button>`;

function noteCell(c,n,isHome){
  const f=NOTEFIELD[n.kind];
  switch(c.id){
    case 'id': return `<td><button class="keybtn" data-nopen="${n.id}" title="Open note">${esc(n.nid)}</button></td>`;
    case 'project': return `<td>${pbadge(proj(n.project),true)} <span class="pname">${esc(proj(n.project).name)}</span></td>`;
    case 'title': return editableCell({id:n.id,k:'title',attr:'data-nedit',value:n.title,ph:'',cls:'title',label:'Title'});
    case 'target': return editableCell({id:n.id,k:f.k,attr:'data-nedit',value:n[f.k],ph:f.ph,cls:n.kind==='plan'?'mono':'',label:f.label,
      shown:n.kind==='reference'&&n.url?`<a class="ext" href="${esc(n.url)}" target="_blank" rel="noreferrer noopener" title="${esc(n.url)}">${esc(n.url)}</a>`:undefined});
    case 'cards': return `<td>${n.cards.length?n.cards.map(k=>cardLink(n.project,k)).join(' '):'<span class="muted">—</span>'}</td>`;
    case 'updated': return `<td class="mono">${ago(n.updatedAt)}</td>`;
    case 'by': return `<td>${who(n.by)}</td>`;
    case 'del': return `<td><button class="xbtn" data-ndel="${n.id}" title="Delete" aria-label="Delete ${esc(n.title)}">×</button></td>`;
  }
  return '<td></td>';
}

function noteComposer(cols,isHome){
  const f=NOTEFIELD[TAB().note];
  let out='';
  for(const c of cols){
    if(c.id==='id') out+=`<td class="key">+ New</td>`;
    else if(c.id==='project') out+=`<td><span class="sel"><select id="nProj" aria-label="Project">${S.projects.map(p=>`<option value="${p.id}" ${p.id===view?'selected':''}>${esc(p.name)}</option>`).join('')}</select></span></td>`;
    else if(c.id==='title') out+=`<td><input id="nTitle" class="cell-in title" placeholder="${esc(NOTE_TITLE_PH[TAB().note])}" aria-label="New ${esc(TAB().note)} title"></td>`;
    else if(c.id==='target') out+=`<td><input id="nTarget" class="cell-in ${TAB().note==='plan'||TAB().note==='reference'?'mono':'note'}" placeholder="${esc(f.ph)}" aria-label="${esc(f.label)}"></td>`;
    else if(c.id==='cards'){ out+=`<td colspan="${cols.length-cols.indexOf(c)}"><button class="btn sm primary" id="nAdd">Add ${esc(TAB().note)}</button></td>`; break }
    else out+='<td></td>';
  }
  return `<tr class="composer">${out}</tr>`;
}

function renderNotesPage(isHome){
  const ns=scopeNotes().sort((a,b)=>b.updatedAt-a.updatedAt), cols=noteCols(isHome);
  const f=NOTEFIELD[TAB().note];
  let rows=S.projects.length?noteComposer(cols,isHome):'';
  for(const n of ns) rows+=`<tr data-nrow="${n.id}">${cols.map(c=>noteCell(c,n,isHome)).join('')}</tr>`;
  if(!ns.length) rows+=`<tr><td colspan="${cols.length}" class="empty">${esc(NOTE_EMPTY[TAB().note])}</td></tr>`;
  const minW=cols.reduce((a,c)=>a+cw('noteColW',c),0);
  return `<div class="tbl-wrap grid ${P.density==='compact'?'compact':''}" style="margin-top:14px"><table style="min-width:${minW}px">
    <thead><tr>${cols.map(c=>`<th style="width:${cw('noteColW',c)}px">${grip('noteColW',c)}${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="hint">Click a row to open it; hover a cell and click its pencil to edit it here. ${esc(NOTE_HINT[TAB().note])}</p>`;
}

/* ---------- table ---------- */
/* A row is for opening. A cell becomes a field only after its pencil is clicked. */
const CHEVRON=`<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const COPYICON=`<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="5" y="5" width="8.5" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;
const PENCIL=`<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M11.5 1.6 14.4 4.5 5.9 13H3v-2.9zM12.9.2a1 1 0 0 1 1.4 0l1.5 1.5a1 1 0 0 1 0 1.4l-1 1L11.9 1.2z"/></svg>`;
function editableCell({id,k,attr,value,ph,cls,label,shown}){
  if(editCell===id+'|'+k) return `<td class="vcell editing ${cls}"><input class="cell-in ${cls}" ${attr}="${k}" data-id="${id}" value="${esc(value)}" placeholder="${esc(ph)}" aria-label="${esc(label)}"></td>`;
  return `<td class="vcell ${cls}"><div class="vrow"><span class="txt">${shown??(value?esc(value):`<span class="ph">${esc(ph)}</span>`)}</span><button class="pencil" data-editcell="${id}|${k}" aria-label="Edit ${esc(label.toLowerCase())}" title="Edit">${PENCIL}</button></div></td>`;
}
function cell(c,f){
  const pr=proj(f.project);
  switch(c.id){
    case 'key': return `<td class="keycell"><input type="checkbox" class="rowsel" data-sel="${f.id}" ${sel.has(f.id)?'checked':''} aria-label="Select ${fkey(f)}">${newDot(f)}<button class="keybtn" data-open="${f.id}" title="Open details">${fkey(f)}</button></td>`;
    case 'project': return `<td><span class="projcell">${pbadge(pr,true)}${esc(pr.name)}</span></td>`;
    case 'title': {
      const td=editableCell({id:f.id,k:'title',attr:'data-edit',value:f.title,ph:'',cls:'title',label:f.type==='question'?'Question':'Title'});
      const notes=S.notes.filter(n=>n.project===f.project&&n.cards.includes(f.key));
      const extra=(notes.length?`<span class="rownotes">${notes.map(n=>`<button class="clink" data-nopen="${n.id}" title="${esc(KINDL[n.kind]+': '+n.title)}">${esc(n.nid.slice(n.nid.indexOf('-')+1))}</button>`).join('')}</span>`:'')
        +(f.status!=='done'?`<button class="rowcopy" data-copy="${f.id}" title="Copy the prompt that picks this up in Claude" aria-label="Copy prompt for ${fkey(f)}">${COPYICON}</button>`:'');
      return extra?td.replace(/<\/div><\/td>$/,extra+'</div></td>'):td;
    }
    case 'area': return `<td>${areaTag(f)}</td>`;
    case 'status': return `<td><span class="sel ${f.status}"><select class="status ${f.status}" data-edit="status" data-id="${f.id}" aria-label="Status">${STATUSES.map(s=>`<option value="${s.id}" ${s.id===f.status?'selected':''}>${sl(s.id)}</option>`).join('')}</select></span></td>`;
    case 'note': {
      const ph=f.status==='parked'?'Where did you stop?':f.status==='done'?'':noteLabel(f);
      return editableCell({id:f.id,k:'note',attr:'data-edit',value:f.note,ph,cls:'note '+f.status,label:noteLabel(f)});
    }
    case 'progress': return `<td>${progBar(f)}</td>`;
    case 'steps': return `<td class="steps">${f.steps.length?`${f.steps.filter(s=>s.done).length}/${f.steps.length}`:'—'}</td>`;
    case 'files': return `<td class="steps">${f.files.length||'—'}</td>`;
    case 'updated': return `<td class="age ${stale(f)?'stale':''}" title="${esc(sinceLabel(f))}">${ago(f.updatedAt)}</td>`;
    case 'by': return `<td>${who(f.by)}</td>`;
  }
}
function composerRow(cols,isHome){
  const projSel=`<select id="cProj" aria-label="Project">${S.projects.map(p=>`<option value="${p.id}" ${p.id===(comp.project||view)?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
  let out='', i=0;
  for(;i<cols.length;i++){
    const c=cols[i];
    if(c.id==='key') out+=`<td class="key">+ New</td>`;
    else if(c.id==='project') out+=`<td><span class="sel">${projSel}</span></td>`;
    else if(c.id==='title') out+=`<td><input id="cTitle" class="cell-in title" placeholder="${P.tab==='questions'?'What do you need to find out?':'Name the work, then Enter'}" aria-label="New card"></td>`;
    else if(c.id==='status') out+=`<td><span class="sel"><select id="cStatus" aria-label="New card status">${STATUSES.map(s=>`<option value="${s.id}" ${s.id===comp.status?'selected':''}>${sl(s.id)}</option>`).join('')}</select></span></td>`;
    else if(c.id==='note') out+=`<td><input id="cNote" class="cell-in note" placeholder="${P.tab==='questions'?'What you need to find out':'Next step (optional)'}" aria-label="Note for the new card"></td>`;
    else break;
  }
  const rest=cols.length-i;
  if(rest>0) out+=`<td colspan="${rest}"><button class="btn sm primary" id="cAdd">Add ${P.tab==='questions'?'question':'card'}</button></td>`;
  if(isHome&&!cols.some(c=>c.id==='project')) out=out.replace('<td class="key">+ New</td>',`<td class="key">+ New</td>`);
  return `<tr class="composer">${out}</tr>`;
}
function renderTable(fs,isHome){
  const cols=visibleCols(isHome);
  const th=c=>`<th style="${c.flex&&!(P.colW&&P.colW[c.id])?`min-width:${c.w}px`:`width:${cw('colW',c)}px`}">${grip('colW',c)}${c.id==='key'?`<input type="checkbox" class="rowsel" id="selAll" aria-label="Select all shown" ${fs.length&&fs.every(f=>sel.has(f.id))?'checked':''}>`:''}${c.sort?`<button data-sort="${c.sort}">${colLabel(c)}${sort.k===c.sort?`<span class="arr">${sort.dir>0?'↑':'↓'}</span>`:''}</button>`:colLabel(c)}</th>`;
  let rows=composerRow(cols,isHome);
  for(const g of groupsOf(sortFs(fs),isHome)){
    const shut=g.id&&(P.collapsed||[]).includes(g.id);
    if(g.id) rows+=`<tr class="grp" data-grprow="${g.id}"><td colspan="${cols.length}"><button class="grp-toggle" data-grp="${g.id}" aria-expanded="${!shut}" aria-label="${shut?'Show':'Hide'} this group">${CHEVRON}</button>${g.head} · ${g.items.length}${shut?` <span class="grp-peek">${g.items.slice(0,4).map(f=>esc(f.title)).join(' · ')}${g.items.length>4?` · +${g.items.length-4}`:''}</span>`:''}</td></tr>`;
    if(shut) continue;
    for(const f of g.items) rows+=`<tr data-row="${f.id}" class="${f.status==='parked'?'is-parked':''} ${f.status==='done'?'is-done':''} ${f.status==='idea'?'is-idea':''}">${cols.map(c=>cell(c,f)).join('')}</tr>`;
  }
  if(!fs.length) rows+=`<tr><td colspan="${cols.length}" class="empty">Nothing here yet. Add one in the row above.</td></tr>`;
  const minW=cols.reduce((a,c)=>a+cw('colW',c),0);
  return `${bulkBar()}<div class="tbl-wrap grid ${P.density==='compact'?'compact':''}"><table style="min-width:${minW}px;width:100%"><thead><tr>${cols.map(th).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="hint">Click a row to open its card. Hover a title or note and click its pencil to edit it here.</p>`;
}

/* ---------- bulk actions ---------- */
/* Parked isn't offered: parking needs a line per card saying where it stopped. */
function bulkBar(){
  if(!sel.size) return '';
  const n=sel.size, targets=STATUSES.filter(s=>s.id!=='parked');
  return `<div class="bulkbar" role="region" aria-label="Selected cards"><b>${n} selected</b>
    <button class="btn sm primary" id="bulkDone">Mark done</button>
    <span class="opt">Move to<select id="bulkMove" aria-label="Move selected to"><option value="">\u2026</option>${targets.map(s=>`<option value="${s.id}">${sl(s.id)}</option>`).join('')}</select></span>
    <button class="btn sm danger" id="bulkDel">Delete</button>
    <button class="linkbtn" id="bulkClear">Clear</button></div>`;
}
async function bulkStatus(status){
  const cards=[...sel].map(id=>S.features.find(f=>f.id===id)).filter(f=>f&&f.status!==status);
  if(!cards.length){sel.clear();render();return}
  const before=cards.map(f=>({id:f.id,status:f.status,note:f.note}));
  let ok=0;
  for(const f of cards){ try{ replaceCard(f.project,await api('/api/projects/'+f.project+'/features/'+f.key,{method:'PATCH',body:JSON.stringify({status})})); ok++ }catch(e){ toast(fkey(f)+': '+e.message) } }
  sel.clear(); render();
  toast(`${ok} card${ok===1?'':'s'} \u2192 ${sl(status)}`,async()=>{
    for(const b of before){const f=S.features.find(x=>x.id===b.id); if(f) try{ replaceCard(f.project,await api('/api/projects/'+f.project+'/features/'+f.key,{method:'PATCH',body:JSON.stringify({status:b.status,note:b.note})})) }catch(e){} }
    render(); toast('Put back');
  });
}
async function bulkDelete(){
  const cards=[...sel].map(id=>S.features.find(f=>f.id===id)).filter(Boolean);
  if(!cards.length) return;
  if(!confirm(`Delete ${cards.length} card${cards.length===1?'':'s'}? ${cards.map(fkey).join(', ')}\n\nThis can\u2019t be undone. Merging a card into another keeps its history.`)) return;
  let ok=0; for(const f of cards) if(await deleteCard(f)) ok++;
  sel.clear(); render(); toast(`Deleted ${ok} card${ok===1?'':'s'}`);
}

/* ---------- board ---------- */
function renderBoard(fs,isHome){
  /* Empty columns keep their place in the row — you still need to drop into
     them — but not their width: four cards shouldn't share a fifth of the board
     with two columns holding nothing. */
  const shown=STATUSES.filter(s=>!(P.hideDone&&s.id==='done'&&filter!=='done'));
  const counts=Object.fromEntries(shown.map(s=>[s.id,fs.filter(f=>f.status===s.id).length]));
  const track=shown.map(s=>counts[s.id]?'minmax(220px,1fr)':'132px').join(' ');
  const minW=shown.reduce((a,s)=>a+(counts[s.id]?230:132),0);
  let h=`<div class="board-wrap"><div class="board" style="grid-template-columns:${track};min-width:${minW}px">`;
  for(const s of shown){
    const cs=fs.filter(f=>f.status===s.id).sort((a,b)=>b.updatedAt-a.updatedAt);
    h+=`<div class="col${cs.length?'':' empty'}" data-col="${s.id}"><div class="col-h"><span class="dot" style="background:${color(s.id)}"></span>${sl(s.id)}<span class="n">${cs.length}</span></div>`;
    for(const f of cs){
      h+=`<div class="card ${f.status}" draggable="true" data-open="${f.id}" data-id="${f.id}" tabindex="0" role="button" aria-label="${esc(f.title)}">
        <div class="t">${esc(f.title)}</div>${f.note&&['parked','active','review'].includes(f.status)?`<div class="note">${esc(f.note)}</div>`:''}
        ${progress(f)===null?'':progBar(f)}
        <div class="meta">${isHome?pbadge(proj(f.project),true):''}${newDot(f)}<span>${fkey(f)}</span><span class="age ${stale(f)?'stale':''}" title="${esc(sinceLabel(f))}">${ago(f.updatedAt)}</span><span class="by">${who(f.by)}</span>${f.status!=='done'?`<button class="rowcopy" data-copy="${f.id}" title="Copy the prompt that picks this up in Claude" aria-label="Copy prompt for ${fkey(f)}">${COPYICON}</button>`:''}</div></div>`;
    }
    h+='</div>';
  }
  return h+`</div></div><p class="hint">Drag cards between columns. Dropping into Parked asks where you stopped.</p>`;
}

/* ---------- timeline ---------- */
function renderTimeline(fs,isHome){
  const days=14, end=Date.now()+D*0.5, start=end-days*D, span=end-start;
  const x=t=>Math.max(0,Math.min(100,(t-start)/span*100));
  let hd='';
  for(let i=1;i<days;i+=2){const t=start+i*D;const d=new Date(t);hd+=`<span style="left:${x(t)}%">${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>`}
  let body='';
  for(const g of groupsOf([...fs].sort((a,b)=>a.createdAt-b.createdAt),isHome)){
    if(g.id) body+=`<div class="tl-grp">${g.head} · ${g.items.length}</div>`;
    for(const f of g.items){
      const s=x(f.createdAt);
      let marks='';
      if(f.status==='idea') marks=`<span class="tl-dot" style="left:${s}%" title="Added ${ago(f.createdAt)} ago"></span>`;
      else{
        const e=f.status==='active'?x(Date.now()):x(f.updatedAt);
        marks=`<span class="tl-bar" style="left:${s}%;width:${Math.max(0.6,e-s)}%;background:${color(f.status)}" title="${sl(f.status)}"></span>`;
        if(f.status==='parked'){const n=x(Date.now());marks+=`<span class="tl-idle" style="left:${e}%;width:${Math.max(0,n-e)}%"><span>idle ${ago(f.updatedAt)}</span></span>`}
        /* Your turn: the useful length is how long it has waited on you. */
        if(f.status==='review'){const n=x(Date.now());marks+=`<span class="tl-idle wait" style="left:${e}%;width:${Math.max(0,n-e)}%"><span>waiting ${ago(f.updatedAt)}</span></span>`}
      }
      body+=`<div class="tl-lbl" data-open="${f.id}"><span class="k">${fkey(f)}</span><span class="t">${esc(f.title)}</span></div>
        <div class="tl-row" data-open="${f.id}" style="--day:${100/days}%">${marks}<span class="tl-now" style="left:${x(Date.now())}%"></span></div>`;
    }
  }
  if(!fs.length) body=`<div class="empty" style="grid-column:1/-1">Nothing matches.</div>`;
  return `<div class="tl-wrap"><div class="tl"><div class="tl-h"><div style="border-right:1px solid var(--line);padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600">Card</div><div class="tl-days">${hd}</div></div>${body}</div></div>
  <div class="legend">${STATUSES.filter(s=>s.id!=='idea').map(s=>`<span><i style="background:${color(s.id)}"></i>${s.label}</span>`).join('')}<span><i style="border:2px dashed var(--s-parked);height:0;background:none"></i>Idle since parked</span><span><i style="border:2px dashed var(--s-review);height:0;background:none"></i>Waiting on you</span><span><i style="border:2px solid var(--s-idea);border-radius:50%;width:10px;height:10px;background:none"></i>Idea added</span></div>
  <p class="hint">Last 14 days. Bars run from when a card was opened to its last update; active work runs to now, and a dashed line is time spent waiting.</p>`;
}

async function setStatus(id,status,extra){
  const f=S.features.find(x=>x.id===id); if(!f||f.status===status) return false;
  // Parking needs a note — the CLI refuses without one, so collect it before saving.
  if(status==='parked'&&!f.note.trim()&&!extra?.note){
    pendingPark=f.id; openId=f.id; render();
    setTimeout(()=>{const n=$('noteIn'); if(n) n.focus()},30);
    toast('Say where you stopped, then press Park');
    return false;
  }
  const before={status:f.status,note:f.note};
  const ok=await saveCard(f,{status,...(extra||{})});
  if(ok) toast(`${fkey(f)} \u2192 ${sl(status)}`,()=>{const g=S.features.find(x=>x.id===id);if(g) saveCard(g,before).then(k=>k&&toast(`${fkey(f)} back to ${sl(before.status)}`))});
  return ok;
}

/* Drag a header's right edge to resize its column; double-click to reset it.
   Widths live with the other view prefs in this browser. */
function bindGrips(){
  document.querySelectorAll('.colgrip').forEach(g=>{
    g.onpointerdown=e=>{
      e.preventDefault(); e.stopPropagation();
      const th=g.parentElement, table=th.closest('table'), map=g.dataset.map, id=g.dataset.grip;
      const x0=e.clientX, w0=th.getBoundingClientRect().width, t0=parseFloat(table.style.minWidth)||table.getBoundingClientRect().width;
      try{ g.setPointerCapture(e.pointerId) }catch(err){}
      g.classList.add('drag'); document.body.classList.add('resizing');
      /* On the window, not the grip: the pointer leaves a 10px grip at once. */
      const move=ev=>{ const w=Math.max(56,Math.round(w0+ev.clientX-x0)); th.style.width=w+'px'; th.style.minWidth=''; table.style.minWidth=(t0+w-w0)+'px' };
      const up=()=>{ removeEventListener('pointermove',move); removeEventListener('pointerup',up); removeEventListener('pointercancel',up);
        g.classList.remove('drag'); document.body.classList.remove('resizing');
        P[map]={...(P[map]||{}),[id]:Math.round(th.getBoundingClientRect().width)}; savePrefs() };
      addEventListener('pointermove',move); addEventListener('pointerup',up); addEventListener('pointercancel',up);
    };
    g.onclick=e=>e.stopPropagation();
    g.ondblclick=e=>{ e.stopPropagation(); const map=g.dataset.map; if(P[map]){ delete P[map][g.dataset.grip]; savePrefs(); render() } };
  });
  if($('colReset')) $('colReset').onclick=()=>{ P.colW={}; savePrefs(); render() };
}

function handoffPrompt(f){
  const p=proj(f.project), left=f.steps.filter(s=>!s.done);
  if(f.type==='question') return [`Find out: "${f.title}" (${fkey(f)}) in ${p.path}.`,
    f.note?`${noteLabel(f)}: ${f.note}`:'',
    left.length?`Still to check:\n${left.map(s=>'- '+s.text).join('\n')}`:'',
    `Move it to Looking into while you work. When you have the answer, record it with \`board answer ${fkey(f)} "..."\` \u2014 that marks it Answered, not Decided. The decision is mine.`].filter(Boolean).join('\n\n');
  return [`Continue ${fkey(f)} "${f.title}" in ${p.path}.`,
    `Status: ${sl(f.status)}.`,
    f.note?`${noteLabel(f)}: ${f.note}`:'',
    left.length?`Remaining steps:\n${left.map(s=>'- '+s.text).join('\n')}`:'',
    f.files.length?`Files touched so far: ${f.files.join(', ')}`:'',
    `Move the card to In progress now, tick steps as you finish them, and update the board before you stop.`].filter(Boolean).join('\n\n');
}

/* ---------- drawer ---------- */
/* A drawer's long text shows whole: the box grows with it instead of scrolling. */
/* The scrim covers the table while a drawer is open. A click on it that lands over
   another row means "show me that one" — switch straight to it, one click. */
function underScrim(e){
  const scrim=$('scrim'); if(!scrim) return null;
  scrim.style.pointerEvents='none';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  scrim.style.pointerEvents='';
  const row=el&&el.closest('tr[data-row],tr[data-nrow],.card[data-open],.tl-lbl[data-open],.tl-row[data-open]');
  if(!row) return null;
  return row.dataset.row?{card:row.dataset.row}:row.dataset.nrow?{note:row.dataset.nrow}:{card:row.dataset.open};
}
function openTarget(t){ if(!t) return; if(t.card){openNote=null;openId=t.card}else{openId=null;openNote=t.note} renderDrawer() }
function fitText(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';el.classList.toggle('scrolls',el.scrollHeight>el.clientHeight+2)}
function fitDrawerText(){document.querySelectorAll('#drawerRoot textarea').forEach(t=>{fitText(t);t.addEventListener('input',()=>fitText(t))})}
/* Proof: a commit hash becomes a link into the repo; a URL shows its host. */
const isSha=x=>/^[0-9a-f]{7,40}$/i.test(x);
function proofItem(f,x){
  const repo=proj(f.project)?.repoUrl;
  const href=isSha(x)?(repo?repo+'/commit/'+x:''):/^https?:\/\//.test(x)?x:'';
  const label=isSha(x)?'commit '+x.slice(0,7):x.replace(/^https?:\/\/(www\.)?/,'');
  return `<li>${href?`<a class="ext" href="${esc(href)}" target="_blank" rel="noreferrer noopener" title="${esc(x)}">${esc(label)}</a>`:`<span class="mono">${esc(label)}</span>`}<button class="xbtn" data-unlink="${esc(x)}" title="Remove" aria-label="Remove ${esc(label)}">×</button></li>`;
}
/* The area chip is a dropdown, like the status chip: click it to move the card.
   The first option puts it back where its files say. Dashed = guessed from folders, not named yet. */
function areaChoices(pid){
  const named=(S.areas[pid]||[]).map(a=>a.name);
  const guessed=[...new Set(S.features.filter(x=>x.project===pid).map(x=>x.inArea).filter(n=>n&&!named.includes(n)))].sort();
  return {named,all:[...named,...guessed]};
}
const areaTag=f=>{
  const {named,all}=areaChoices(f.project), guess=f.inArea&&!named.includes(f.inArea);
  const auto=f.area?'':f.inArea;
  const tip=!f.inArea?'No area yet — pick one':f.area?'Put here by hand':guess?'Guessed from folder names':'From its files';
  return `<span class="sel areasel"><select class="areachip ${guess?'guess':''} ${f.inArea?'':'none'}" data-edit="area" data-id="${f.id}" aria-label="Area" title="${tip}">
    <option value="" ${f.area?'':'selected'}>${auto?esc(auto):f.area?'From its files':'No area'}</option>
    ${all.filter(n=>n!==auto).map(n=>`<option value="${esc(n)}" ${f.area===n?'selected':''}>${esc(n)}</option>`).join('')}</select></span>` };

/* The part of the product a card is in. Claude works it out from the files; this is for when it guessed wrong. */
function structureFields(f){
  const named=(S.areas[f.project]||[]).map(a=>a.name);
  const guessed=[...new Set(S.features.filter(x=>x.project===f.project).map(x=>x.inArea).filter(n=>n&&!named.includes(n)))].sort();
  const auto=f.area?'':f.inArea;
  return `<div class="field"><label class="lbl" for="areaSel">Area</label><span class="sel"><select id="areaSel">
      <option value="" ${f.area?'':'selected'}>${auto?`From its files: ${esc(auto)}`:'From its files (none yet)'}</option>
      ${[...named,...guessed].map(n=>`<option value="${esc(n)}" ${f.area===n?'selected':''}>${esc(n)}</option>`).join('')}</select></span></div>`;
}
function renderDrawer(){
  if(openNote) return renderNoteDrawer();
  const f=S.features.find(x=>x.id===openId);
  if(!f){$('drawerRoot').innerHTML='';return}
  markSeen(f);
  const isQ=f.type==='question', noteLbl=noteLabel(f);
  const done=f.steps.filter(s=>s.done).length;
  const parking=pendingPark===f.id;
  /* Your turn is a question for you: does it work? Answer it in one click. */
  const verdict=f.status==='review'?`<div class="verdict" id="verdict">
      <div class="vq"><b>${isQ?'Claude found an answer':'Your turn'}</b><span>${isQ?'Settle it, or send Claude back to look further.':'Check it against what’s below. Does it work?'}</span></div>
      <div class="vbtns"><button class="btn primary" id="vDone">${isQ?'Decide — mark Decided':'Looks good — Done'}</button><button class="btn" id="vBack">${isQ?'Keep looking':'Needs work'}</button></div>
      <div class="vback" id="vBackForm" hidden><label class="lbl" for="vBackNote">${isQ?'What’s still missing':'What’s wrong or missing'}</label>
        <textarea id="vBackNote" placeholder="${isQ?'What the answer doesn’t cover yet':'Claude sees this as the next step when it picks the card up'}"></textarea>
        <div class="r"><button class="btn sm ghost" id="vBackCancel">Cancel</button><button class="btn sm primary" id="vBackSave">Send back</button></div></div>
    </div>`:'';
  const showProof=f.links.length||f.status==='review'||f.status==='done';
  $('drawerRoot').innerHTML=`<div class="scrim" id="scrim"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(f.title)}">
    <div class="drawer-h"><div class="row"><span class="mono">${fkey(f)} · ${esc(proj(f.project).name)}</span><button class="btn sm ghost" id="dClose">Close</button></div>
      <textarea class="title-in" id="titleIn" rows="1" aria-label="${isQ?'Question':'Title'}">${esc(f.title)}</textarea>${isQ||!f.steps.length?'':progBar(f)}</div>
    <div class="drawer-b">
      ${verdict}
      <div class="field"><span class="lbl">Status</span><div class="seg">${STATUSES.map(s=>`<button data-st="${s.id}" aria-pressed="${f.status===s.id}"><span class="dot" style="background:${color(s.id)}"></span>${sl(s.id)}</button>`).join('')}</div></div>
      <div class="field"><label class="lbl" for="noteIn">${noteLbl}</label><textarea id="noteIn" class="${f.status==='parked'||parking?'stopnote':''}" placeholder="${f.status==='parked'||parking?'What was left undone, and why you switched away':'Context for the next session'}">${esc(f.note)}</textarea>
        ${parking?`<div class="r"><button class="btn sm primary" id="parkBtn">Park with this note</button></div>`:''}</div>
      ${structureFields(f)}
      ${showProof?`<div class="field"><span class="lbl"><span>Proof</span><span class="hint">A commit, a PR or a page to check it on</span></span>
        ${f.links.length?`<ul class="proof">${f.links.map(x=>proofItem(f,x)).join('')}</ul>`:`<span class="hint">Nothing linked yet. Claude adds the commit or page when it hands a card to you.</span>`}
        <form class="addstep" id="linkForm"><input id="linkIn" class="mono" placeholder="https://… or a commit hash" aria-label="Add a link"><button class="btn sm">Add</button></form></div>`:''}
      <div class="field"><span class="lbl"><span>${isQ?'What to check':'Steps'}</span>${f.steps.length?`<span class="mono">${done}/${f.steps.length}</span>`:''}</span>
        <ul class="checklist">${f.steps.map((s,i)=>`<li><label class="${s.done?'done':''}"><input type="checkbox" data-step="${i}" ${s.done?'checked':''}><span>${esc(s.text)}</span></label></li>`).join('')}</ul>
        <form class="addstep" id="stepForm"><input id="stepIn" placeholder="${isQ?'Add something to check':'Add a step'}" aria-label="New step"><button class="btn sm">Add</button></form></div>
      ${f.status!=='done'?`<div class="handoff"><b>${isQ?'Find this out with Claude':'Continue with Claude'}</b><p>${isQ?'Hands Claude the question and what you’re checking. It records what it finds as the answer — deciding stays yours.':'Gives Claude everything it needs to pick this up: where you stopped, the remaining steps and the files involved.'}</p><div><button class="btn primary sm" id="handoffBtn">Copy the prompt</button></div></div>`:''}
      ${isQ&&!f.files.length?'':`<div class="field"><span class="lbl">Files touched</span>${f.files.length?`<ul class="files">${f.files.map(x=>`<li class="mono">${esc(x)}</li>`).join('')}</ul>`:'<span class="hint">None yet. Claude records files as it edits them.</span>'}</div>`}
      ${sourceNotes(f)}
      <div class="field"><span class="lbl">Activity</span><ul class="log">${[...f.log].reverse().map(l=>`<li>${who(l.by)}<span>${esc(l.text)}<div class="when">${ago(l.at)} ago</div></span></li>`).join('')}</ul></div>
      <div class="drawer-f"><button class="btn danger ghost" id="dDel">${isQ?'Delete question':'Delete card'}</button><span class="saved" id="savedTag" aria-live="polite">Changes save when you leave a field</span></div>
    </div></aside>`;
  fitDrawerText();
  const close=()=>commit().then(()=>{openId=null;pendingPark=null;render()});
  $('scrim').onclick=e=>{const t=underScrim(e); commit().then(()=>{openId=null;pendingPark=null;render();openTarget(t)})};
  $('dClose').onclick=close;
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>commit().then(()=>setStatus(f.id,b.dataset.st)));
  document.querySelectorAll('[data-step]').forEach(c=>c.onchange=()=>{
    const steps=f.steps.map((s,i)=>({text:s.text,done:i===+c.dataset.step?c.checked:s.done}));
    commit().then(()=>saveCard(f,{steps}))});
  $('stepForm').onsubmit=e=>{e.preventDefault();const t=$('stepIn').value.trim();if(!t)return;
    commit().then(()=>saveCard(f,{steps:[...f.steps.map(s=>({text:s.text,done:s.done})),{text:t,done:false}]}))
      .then(()=>$('stepIn')?.focus())};
  if($('linkForm')) $('linkForm').onsubmit=e=>{e.preventDefault();const t=$('linkIn').value.trim();if(!t)return;
    commit().then(()=>saveCard(f,{links:[...f.links,t]})).then(()=>$('linkIn')?.focus())};
  document.querySelectorAll('[data-unlink]').forEach(b=>b.onclick=()=>commit().then(()=>saveCard(f,{links:f.links.filter(x=>x!==b.dataset.unlink)})));
  if($('handoffBtn')) $('handoffBtn').onclick=()=>commit().then(()=>copyPrompt(f));
  if($('areaSel')) $('areaSel').onchange=e=>commit().then(()=>saveCard(f,{area:e.target.value}));
  document.querySelectorAll('[data-nopen]').forEach(b=>b.onclick=()=>commit().then(()=>openTheNote(b.dataset.nopen)));
  $('dDel').onclick=()=>{ if(!confirm('Delete '+fkey(f)+' "'+f.title+'"? Merging it into another card keeps the history.')) return;
    deleteCard(f).then(ok=>{if(ok){openId=null;render();toast('Deleted')}})};

  // A1: one click to close the loop, or send it back with a reason.
  if($('vDone')) $('vDone').onclick=()=>commit().then(()=>setStatus(f.id,'done'));
  if($('vBack')) $('vBack').onclick=()=>{$('vBackForm').hidden=false;$('vBack').hidden=true;$('vBackNote').focus()};
  if($('vBackCancel')) $('vBackCancel').onclick=()=>{$('vBackForm').hidden=true;$('vBack').hidden=false};
  if($('vBackSave')) $('vBackSave').onclick=()=>{const why=$('vBackNote').value.trim();
    if(!why){$('vBackNote').focus();toast('Say what’s wrong, so the next session knows');return}
    commit().then(()=>setStatus(f.id,'active',{note:(isQ?'Still missing: ':'Needs work: ')+why}))};

  // A2: title and note save when you leave them (or press ⌘Enter); closing saves too.
  const autosave=el=>{ if(!el) return;
    el.addEventListener('blur',()=>{ if(pendingPark===f.id&&el.id==='noteIn') return; saveNow() });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();saveNow()} if(e.key==='Enter'&&(el.tagName==='INPUT'||el.id==='titleIn')){e.preventDefault();el.blur()} });
  };
  autosave($('titleIn')); autosave($('noteIn'));
  if($('parkBtn')) $('parkBtn').onclick=()=>commit().then(ok=>{if(ok!==false) toast(fkey(f)+' parked')});

  async function saveNow(){
    const back=document.activeElement&&document.activeElement.id;   /* keep the cursor where you moved it */
    const tag=$('savedTag'); const ok=await commit();
    if(back&&back!=='titleIn'&&back!=='noteIn'&&$(back)) $(back).focus();
    const t=$('savedTag'); if(t&&ok&&ok!=='same'){t.textContent='Saved';t.classList.add('on');setTimeout(()=>{const u=$('savedTag');if(u){u.classList.remove('on');u.textContent='Changes save when you leave a field'}},1600)}
  }
  /* Write the open fields back. Returns false if the server refused, 'same' if nothing changed. */
  async function commit(){
    const ti=$('titleIn'), ni=$('noteIn'); if(!ti) return true;
    const t=ti.value.replace(/\s*\n\s*/g,' ').trim()||f.title, n=ni.value.trim();   // a pasted line break doesn't belong in a title
    const parkNow=pendingPark===f.id&&n;
    if(t===f.title&&n===f.note&&!parkNow) return 'same';
    if(parkNow) pendingPark=null;
    return saveCard(f,{title:t,note:n,...(parkNow?{status:'parked'}:{})});
  }
}


/* ---------- note drawer ---------- */
/* A note has no status and no progress, so this panel answers different
   questions than a card's: what was decided, where the document is, and what
   came of it. */
const NOTE_UNLINKED={
  brainstorm:'No cards yet. Claude links the ones a decision produced.',
  plan:'No cards from this document yet \u2014 /clipped:plan turns it into some.',
  reference:'Not linked to a card yet.'};
const hostOf=u=>{try{return new URL(u).host}catch(e){return u}};
const noteCards=n=>n.cards.map(k=>S.features.find(f=>f.project===n.project&&f.key===k)).filter(Boolean);
/* "6 cards · 2 done · 1 parked" — the line that says whether a plan happened. */
const stLabel=f=>(f.type==='question'?QSL:SL)[f.status];
function cardTally(cards){
  if(!cards.length) return '';
  const bits=[`${cards.length} card${cards.length===1?'':'s'}`];
  // Only the states that mean something; the rest is arithmetic the eye can do.
  for(const st of ['done','parked','review']){
    const k=cards.filter(f=>f.status===st).length;
    if(k) bits.push(`${k} ${SL[st].toLowerCase()}`);
  }
  return bits.join(' \u00b7 ');
}
/* The other direction: notes pointing at this card — the plan it came from,
   the brainstorm that settled it, the page that answered it. */
function sourceNotes(f){
  const ns=S.notes.filter(n=>n.project===f.project&&n.cards.includes(f.key));
  if(!ns.length) return '';
  return `<div class="field"><span class="lbl">Linked notes</span><ul class="nlinks">${ns.map(n=>
    `<li><button class="nlink" data-nopen="${n.id}"><span class="mono st">${esc(n.nid)}</span><span class="t">${esc(n.title)}</span><span class="st">${esc(KINDL[n.kind])}</span></button></li>`).join('')}</ul></div>`;
}
function openTheNote(id){
  const n=S.notes.find(x=>x.id===id); if(!n) return;
  openId=null; openNote=n.id; P.tab=n.kind+'s'; filter='all'; savePrefs(); render();
}
function planPrompt(n){
  const p=proj(n.project), cards=noteCards(n);
  return [`Re-read ${n.file} in ${p.path} and put anything new on the board.`,
    cards.length?`${n.nid} already produced: ${cards.map(f=>f.key+' '+f.title).join(', ')}. Skip those, and anything else already on the board that means the same thing.`
      :`${n.nid} hasn't produced any cards yet.`,
    `An unticked checkbox is work too: something to find out is a question, something to do is a chore. Show me the list before you add anything.`].join('\n\n');
}

function renderNoteDrawer(){
  const n=S.notes.find(x=>x.id===openNote);
  if(!n){openNote=null;$('drawerRoot').innerHTML='';return}
  const fld=NOTEBODY[n.kind], cards=noteCards(n);
  const target=n.kind==='reference'
    ? `<div class="field"><label class="lbl" for="nUrl">Link</label><input id="nUrl" class="fin mono" value="${esc(n.url)}" placeholder="https://\u2026" aria-label="Link">${n.url?`<a class="ext" href="${esc(n.url)}" target="_blank" rel="noreferrer noopener">Open ${esc(hostOf(n.url))}</a>`:''}</div>`
    : n.kind==='plan'
    ? `<div class="field"><label class="lbl" for="nFile">Document</label><input id="nFile" class="fin mono" value="${esc(n.file)}" placeholder="docs/plan.md" aria-label="Document"><span class="hint">The document holds the reasoning; the board holds what came of it. Editing a card never edits the document.</span></div>`
    : '';

  $('drawerRoot').innerHTML=`<div class="scrim" id="scrim"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(n.title)}">
    <div class="drawer-h"><div class="row"><span class="mono">${esc(n.nid)} \u00b7 ${esc(proj(n.project).name)}</span><button class="btn sm ghost" id="dClose">Close</button></div>
      <input class="title-in" id="nTitleIn" value="${esc(n.title)}" aria-label="${esc(KINDL[n.kind])} title">
      <div class="row"><span class="kindtag">${esc(KINDL[n.kind])}</span><span>updated ${ago(n.updatedAt)} ago by ${n.by==='claude'?'Claude':'you'}</span></div></div>
    <div class="drawer-b">
      ${target}
      <div class="field"><label class="lbl" for="nBody">${esc(fld.label)}</label><textarea id="nBody" placeholder="${esc(fld.ph)}">${esc(n.body)}</textarea></div>
      ${n.kind==='brainstorm'?`<div class="field"><label class="lbl" for="nConsidered">What was considered</label><textarea id="nConsidered" placeholder="The options that lost, and why \u2014 what answers \u201cwhy didn\u2019t we just\u2026\u201d later">${esc(n.considered)}</textarea></div>`:''}
      <div class="field"><span class="lbl"><span>${n.kind==='reference'?'Where it was used':'What it produced'}</span>${cards.length?`<span class="mono">${esc(cardTally(cards))}</span>`:''}</span>
        ${cards.length?`<ul class="nlinks">${cards.map(f=>`<li><button class="nlink" data-gocard="${f.id}"><span class="dot" style="background:${color(f.status)}"></span><span class="mono st">${esc(f.key)}</span><span class="t">${esc(f.title)}</span><span class="st">${esc(stLabel(f))}</span></button></li>`).join('')}</ul>`
          :`<span class="hint">${esc(NOTE_UNLINKED[n.kind])}</span>`}</div>
      ${n.kind==='plan'&&n.file?`<div class="handoff"><b>Bring it to the board again</b><p>Plans get edited. This asks Claude to re-read the document and add only what isn\u2019t on the board yet.</p><div><button class="btn primary sm" id="nHandoff">Get the prompt</button></div></div>`:''}
      <div class="drawer-f"><button class="btn danger ghost" id="nDel">Delete ${esc(KINDL[n.kind].toLowerCase())}</button><span class="saved" id="savedTag" aria-live="polite">Changes save when you leave a field</span></div>
    </div></aside>`;

  fitDrawerText();
  const close=()=>commitNote().then(()=>{openNote=null;render()});
  $('scrim').onclick=e=>{const t=underScrim(e); commitNote().then(()=>{openNote=null;render();openTarget(t)})};
  $('dClose').onclick=close;
  ['nTitleIn','nBody','nConsidered','nUrl','nFile'].forEach(id=>{const el=$(id); if(!el) return;
    el.addEventListener('blur',()=>commitNote().then(ok=>{const t=$('savedTag');if(t&&ok&&ok!=='same'){t.textContent='Saved';t.classList.add('on')}}));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey||el.tagName==='INPUT')){e.preventDefault();el.blur()}});
  });
  $('nDel').onclick=()=>{ if(!confirm('Delete '+n.nid+' \u201c'+n.title+'\u201d? The cards it produced stay.')) return;
    deleteNote(n).then(ok=>{if(ok){openNote=null;render();toast(n.nid+' deleted')}})};
  if($('nHandoff')) $('nHandoff').onclick=()=>commitNote().then(()=>openDialog('Paste this into Claude',planPrompt(n)));
  document.querySelectorAll('[data-gocard]').forEach(b=>b.onclick=()=>commitNote().then(()=>{
    const f=S.features.find(x=>x.id===b.dataset.gocard); if(!f) return;
    openNote=null; openId=f.id; P.tab=f.type==='question'?'questions':'features'; filter='all'; savePrefs(); render();
  }));

  /* Write the open fields back. Returns false if the server refused. */
  async function commitNote(){
    const ti=$('nTitleIn'); if(!ti) return true;
    const patch={};
    const title=ti.value.trim()||n.title; if(title!==n.title) patch.title=title;
    const body=$('nBody').value.trim(); if(body!==n.body) patch.body=body;
    if($('nConsidered')&&$('nConsidered').value.trim()!==n.considered) patch.considered=$('nConsidered').value.trim();
    if($('nUrl')&&$('nUrl').value.trim()!==n.url) patch.url=$('nUrl').value.trim();
    if($('nFile')&&$('nFile').value.trim()!==n.file) patch.file=$('nFile').value.trim();
    if(!Object.keys(patch).length) return 'same';
    return saveNote(n,patch);
  }
}

async function copyPrompt(f){
  const text=handoffPrompt(f);
  try{ await navigator.clipboard.writeText(text); toast('Prompt copied \u2014 paste it into Claude') }
  catch(e){ openDialog('Paste this into Claude',text) }
}
document.addEventListener('click',e=>{
  /* a pill dropdown opens from anywhere on the pill, not just its value */
  const pill=e.target.closest('.opt'); const ps=pill&&pill.querySelector('select');
  if(ps&&e.target!==ps&&!ps.contains(e.target)){try{ps.showPicker()}catch(_){ps.focus()}return}
  const cp=e.target.closest('[data-copy]'); if(cp){e.stopPropagation();const f=S.features.find(x=>x.id===cp.dataset.copy);if(f) copyPrompt(f);return}
  /* The menu folds to a rail from a click on its empty space, and opens from a click anywhere on the rail but a project. */
  const side=e.target.closest('#side');
  if(side&&(P.sideShut?!e.target.closest('[data-go],[data-init]'):!e.target.closest('button,a,input,select,textarea,label,form,.nav-item'))){
    P.sideShut=!P.sideShut; savePrefs(); $('app').classList.toggle('side-shut',P.sideShut); $('side').title=P.sideShut?'Click to open the menu':'Click empty space to fold the menu'; return }
  const g=e.target.closest('[data-go]'); if(g){view=g.dataset.go;query='';filter='all';openId=null;openNote=null;comp.project=null;sel.clear();render();window.scrollTo(0,0);return}
  const o=e.target.closest('[data-open]'); if(o&&!e.target.closest('.drawer')){openNote=null;openId=o.dataset.open;renderDrawer();return}
  const no=e.target.closest('[data-nopen]'); if(no&&!e.target.closest('.drawer')){openTheNote(no.dataset.nopen);return}
  document.querySelectorAll('details.cols[open]').forEach(d=>{ if(!d.contains(e.target)) d.removeAttribute('open') });
});
/* Leaving a row field — by blur, Escape or clicking away — puts it back to text. */
document.addEventListener('focusout',e=>{
  if(!editCell||!e.target?.closest?.('td.vcell.editing')) return;
  setTimeout(()=>{if(editCell&&!document.activeElement?.closest?.('td.vcell.editing')){editCell=null;render()}},0);
});
document.addEventListener('mousedown',e=>{
  if(editCell&&!e.target.closest('td.vcell.editing')){editCell=null;render()}
},true);
/* Two shortcuts, no more: search and new. Any bigger keymap is one nobody
   asked for and everybody has to be taught. */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target, typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(e.key==='Escape'&&t&&t.id==='search'&&query){query='';render();$('search')?.focus();return}
  if(typing||openId||openNote||$('dlg').open) return;
  if(e.key==='/'){e.preventDefault();$('search')?.focus();return}
  if(e.key==='n'){e.preventDefault();$('newBtn')?.click()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&editCell){editCell=null;render();return}
  if(e.key==='Escape'&&(openId||openNote)&&!$('dlg').open){ $('dClose')?.click() }
});
$('dlgClose').onclick=()=>$('dlg').close();
$('dlgCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('dlgPre').textContent);toast('Copied')}catch(e){const r=document.createRange();r.selectNodeContents($('dlgPre'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected — press ⌘C to copy')}};


/* ---------- live: the server pushes when any board changes ---------- */
function setConn(state,label){ live=state==='live'; const t=$('connTag'); if(t){t.textContent=label;t.dataset.state=state} }

const editing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.value!==''};

async function reload(projectId){
  try{ projectId?await loadProject(projectId):await loadAll(); }
  catch(e){ setConn('off','Offline'); return }
  // Don't yank the page out from under someone mid-sentence.
  if(editing()){ dirty=true; return }
  render();
}

function connect(){
  const es=new EventSource(API+'/api/events');
  es.addEventListener('hello',()=>{setConn('live','Live');reload()});
  es.addEventListener('board',ev=>{ let d={}; try{d=JSON.parse(ev.data)}catch(e){}
    reload(d.project||undefined) });
  es.onerror=()=>setConn('off','Reconnecting…');   // EventSource retries on its own
}

// Sessions move without the board changing; check once a minute.
setInterval(async()=>{ if(document.hidden) return; await loadStats(); if(!editing()) render() },60_000);

document.addEventListener('focusout',()=>{ if(dirty&&!editing()){dirty=false;reload()} });

(async function boot(){
  try{ await loadAll(); setConn('live','Live'); }
  catch(e){
    setConn('off','No server');
    $('mainEl').innerHTML=`<div class="head"><div><h1>No local server</h1>
      <p class="sub">This page reads your boards from <span class="mono">${esc(API)}</span>. Start it with <span class="mono">board ui</span> in any project, then reload.</p>
      <p class="sub mono">${esc(e.message)}</p></div></div>`;
    renderNav(); return;
  }
  render();
  connect();
})();
</script>
